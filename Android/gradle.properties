# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Toolchain
# Robolectric 4.14.1 instruments test classes with an ASM version that predates
# recent JDKs; on a JDK newer than 21 the whole suite fails with
# "IllegalArgumentException at ClassReader.java" from tests that have nothing to
# do with each other. CI pins JDK 17. If your default JDK is newer, either run
# Gradle from a JDK 17 shell or uncomment this with your own path:
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17
