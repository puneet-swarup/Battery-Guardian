name: Build and Sign Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BG_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build Release AAB
        env:
          BG_STORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          BG_STORE_PASSWORD: ${{ secrets.BG_STORE_PASSWORD }}
          BG_KEY_ALIAS: ${{ secrets.BG_KEY_ALIAS }}
          BG_KEY_PASSWORD: ${{ secrets.BG_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: Android/app/build/outputs/bundle/release/*.aab

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: ./aab

      - name: Name the bundle after the tag
        run: |
          mkdir -p out
          cp aab/*.aab "out/BatteryGuardian-android-${GITHUB_REF_NAME}.aab"

      # No body and no generated notes: the Windows workflow owns the release
      # text, and updating with only `files` leaves it alone.
      - name: Attach the AAB to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*.aab
          generate_release_notes: false
