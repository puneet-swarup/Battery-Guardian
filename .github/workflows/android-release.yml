name: Build and Sign Android Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CRITICAL: Fetches all history and tags for git describe
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BG_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/release.keystore
          echo "keystore_path=${{ runner.temp }}/release.keystore" >> $GITHUB_OUTPUT

      - name: Build Release AAB
        env:
          BG_STORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          BG_STORE_PASSWORD: ${{ secrets.BG_STORE_PASSWORD }}
          BG_KEY_ALIAS: ${{ secrets.BG_KEY_ALIAS }}
          BG_KEY_PASSWORD: ${{ secrets.BG_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab