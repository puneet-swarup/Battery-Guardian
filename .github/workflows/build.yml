name: Build and Publish EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build -c Release --no-restore
      
    - name: Publish (Self-Contained x64 Executable)
      run: dotnet publish -c Release -r win-x64 --self-contained true -o PublishOutput --no-build
      
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BatteryGuardian-x64-Release
        path: PublishOutput