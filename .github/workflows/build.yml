name: Build and Publish EXE

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Run Tests
      run: dotnet test -c Release --no-build --verbosity normal

    - name: Publish (Self-Contained x64 Executable)
      run: dotnet publish BatteryGuardian.csproj -c Release -r win-x64 --self-contained true -o PublishOutput
      
    - name: Copy installer scripts into publish output
      run: |
        Copy-Item install.bat,install.ps1,uninstall.bat,uninstall.ps1 PublishOutput\ -Force

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v5
      with:
        name: BatteryGuardian-x64-Release
        path: PublishOutput

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: BatteryGuardian-x64-Release
          path: ./artifact

      - name: Zip the folder
        run: |
          cd artifact
          zip -r ../BatteryGuardian-x64-Release.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Battery Guardian ${{ github.ref_name }}
          files: BatteryGuardian-x64-Release.zip
          draft: false
          prerelease: false
          generate_release_notes: true