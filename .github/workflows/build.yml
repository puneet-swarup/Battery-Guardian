name: Build and Publish EXE

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Run Tests
      run: dotnet test -c Release --no-build --verbosity normal

    - name: Publish (Self-Contained x64)
      run: dotnet publish BatteryGuardian.csproj -c Release -r win-x64 --self-contained true -o PublishOutput

    - name: Publish (Framework-Dependent x64)
      run: dotnet publish BatteryGuardian.csproj -c Release -o PublishOutput-FDD

    - name: Copy installer scripts into both outputs
      run: |
        Copy-Item install.bat,install.ps1,uninstall.bat,uninstall.ps1 PublishOutput\ -Force
        Copy-Item install.bat,install.ps1,uninstall.bat,uninstall.ps1 PublishOutput-FDD\ -Force

    - name: Upload Self-Contained Artifact
      uses: actions/upload-artifact@v5
      with:
        name: BatteryGuardian-x64-SelfContained
        path: PublishOutput

    - name: Upload Framework-Dependent Artifact
      uses: actions/upload-artifact@v5
      with:
        name: BatteryGuardian-x64-FrameworkDependent
        path: PublishOutput-FDD

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Self-Contained Artifact
        uses: actions/download-artifact@v5
        with:
          name: BatteryGuardian-x64-SelfContained
          path: ./artifact-selfcontained

      - name: Download Framework-Dependent Artifact
        uses: actions/download-artifact@v5
        with:
          name: BatteryGuardian-x64-FrameworkDependent
          path: ./artifact-fdd

      - name: Zip both variants
        run: |
          cd artifact-selfcontained
          zip -r ../BatteryGuardian-x64-SelfContained.zip .
          cd ../artifact-fdd
          zip -r ../BatteryGuardian-x64-FrameworkDependent.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Battery Guardian ${{ github.ref_name }}
          files: |
            BatteryGuardian-x64-SelfContained.zip
            BatteryGuardian-x64-FrameworkDependent.zip
          draft: false
          prerelease: false
          generate_release_notes: true