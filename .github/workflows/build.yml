name: Build and Publish EXE

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
    # Path filters are not evaluated for tag pushes, so a release always builds.
    # Without them a docs-only change would occupy a windows-latest runner.
    paths:
      - 'Windows/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Windows/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore Windows/BatteryGuardian.slnx

    - name: Build
      run: dotnet build Windows/BatteryGuardian.slnx -c Release --no-restore

    - name: Run Tests
      run: dotnet test Windows/BatteryGuardian.slnx -c Release --no-build --verbosity normal

    - name: Publish (Self-Contained x64)
      run: dotnet publish Windows/BatteryGuardian.csproj -c Release -r win-x64 --self-contained true -o PublishOutput

    - name: Publish (Framework-Dependent x64)
      run: dotnet publish Windows/BatteryGuardian.csproj -c Release -o PublishOutput-FDD

    - name: Copy installer scripts into both outputs
      run: |
        Copy-Item Windows\install.bat,Windows\install.ps1,Windows\uninstall.bat,Windows\uninstall.ps1 PublishOutput\ -Force
        Copy-Item Windows\install.bat,Windows\install.ps1,Windows\uninstall.bat,Windows\uninstall.ps1 PublishOutput-FDD\ -Force

    - name: Upload Self-Contained Artifact
      uses: actions/upload-artifact@v5
      with:
        name: BatteryGuardian-x64-SelfContained
        path: PublishOutput

    - name: Upload Framework-Dependent Artifact
      uses: actions/upload-artifact@v5
      with:
        name: BatteryGuardian-x64-FrameworkDependent
        path: PublishOutput-FDD

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # GitHub's generated notes only list merged pull requests. This project
      # pushes straight to main, so they came out as a bare compare link while
      # CHANGELOG.md held the real content. Take the section for this tag.
      - name: Release notes from the changelog
        run: |
          python3 - <<'EOF'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"(?ms)^## \[{re.escape(tag)}\].*?(?=^## \[|\Z)", text)
          body = m.group(0).strip() if m else f"Release {tag}"
          open("notes.md", "w", encoding="utf-8").write(body + "\n")
          print(body[:400])
          EOF

      - name: Download Self-Contained Artifact
        uses: actions/download-artifact@v5
        with:
          name: BatteryGuardian-x64-SelfContained
          path: ./artifact-selfcontained

      - name: Download Framework-Dependent Artifact
        uses: actions/download-artifact@v5
        with:
          name: BatteryGuardian-x64-FrameworkDependent
          path: ./artifact-fdd

      - name: Zip both variants
        run: |
          cd artifact-selfcontained
          zip -r ../BatteryGuardian-x64-SelfContained.zip .
          cd ../artifact-fdd
          zip -r ../BatteryGuardian-x64-FrameworkDependent.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Battery Guardian ${{ github.ref_name }}
          body_path: notes.md
          files: |
            BatteryGuardian-x64-SelfContained.zip
            BatteryGuardian-x64-FrameworkDependent.zip
          draft: false
          prerelease: false
          generate_release_notes: false