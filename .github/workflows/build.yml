name: Build and Publish EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build -c Release --no-restore
      
    - name: Publish (Self-Contained x64 Executable)
      run: dotnet publish -c Release -r win-x64 --self-contained true -o PublishOutput --no-build
      
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v5
      with:
        name: BatteryGuardian-x64-Release
        path: PublishOutput

  # NEW JOB: Automatically creates a release draft
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' # Only run when pushing to main
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: BatteryGuardian-x64-Release
          path: ./artifact
          
      - name: Zip the folder (to avoid nested folders)
        run: |
          cd artifact
          zip -r ../BatteryGuardian-x64-Release.zip .
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }} # Automatically creates tags: v1, v2, v3...
          name: Battery Guardian v${{ github.run_number }}
          files: BatteryGuardian-x64-Release.zip
          draft: false
          prerelease: false
          generate_release_notes: true